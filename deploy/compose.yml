services:
  web:
    image: ${COD5_IMAGE:?Release image required}
    container_name: codigo5-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8336:8080"
    volumes:
      - /opt/cod5/codigo5-web/data:/data
      - /opt/cod5/codigo5-web/backups:/backups
    environment:
      COD5_SYNC_DRAFT_TOKEN: ${COD5_SYNC_DRAFT_TOKEN:-}
      COD5_SYNC_PUBLISH_TOKEN: ${COD5_SYNC_PUBLISH_TOKEN:-}
      COD5_GSC_ENABLED: ${COD5_GSC_ENABLED:-0}
      COD5_GSC_PORTAL: ${COD5_GSC_PORTAL:-}
      COD5_GSC_ORIGIN: ${COD5_GSC_ORIGIN:-}
      COD5_GSC_CALLBACK_TOKEN: ${COD5_GSC_CALLBACK_TOKEN:-}
      COD5_GSC_NOTIFY_TELEGRAM_USER_ID: ${COD5_GSC_NOTIFY_TELEGRAM_USER_ID:-}
      ADMIN_ALLOWED_EMAILS: leandro@codigo5.com.br
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Editorial OAuth client required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Editorial OAuth secret required}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-}
      BOT_APP_NAME: ${BOT_APP_NAME:-}
      BOT_DEFAULT_TIMEZONE: ${BOT_DEFAULT_TIMEZONE:-}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:-}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-}
      DO_SPACES_KEY: ${DO_SPACES_KEY:-}
      DO_SPACES_PUBLIC_BASE_URL: ${DO_SPACES_PUBLIC_BASE_URL:-}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET:-}
      DO_SPACES_UPLOAD_PREFIX: ${DO_SPACES_UPLOAD_PREFIX:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      TELEGRAM_SECRET_TOKEN: ${TELEGRAM_SECRET_TOKEN:-}
    mem_limit: 384m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
  gsc-worker:
    image: ${COD5_GSC_IMAGE:?GSC worker image required}
    container_name: codigo5-gsc-worker
    restart: unless-stopped
    user: "1000:1000"
    command: ["flock", "-n", "/gsc/worker.lock", "node", "/app/server/gsc-worker.mjs", "run"]
    networks: [default, evolution]
    environment:
      CODIGO5_EVOLUTION_URL: http://cod5-evolution-evolution-1:8080
      CODIGO5_EVOLUTION_KEY: ${CODIGO5_EVOLUTION_KEY:?Editorial Evolution key required}
      CODIGO5_EVOLUTION_INSTANCE: ${CODIGO5_EVOLUTION_INSTANCE:?Editorial instance required}
      CODIGO5_REVIEW_GROUP_JID: ${CODIGO5_REVIEW_GROUP_JID:?Editorial group required}
      HOME: /gsc
      COD5_GSC_PORTAL: ${COD5_GSC_PORTAL:-}
      COD5_GSC_ORIGIN: ${COD5_GSC_ORIGIN:-}
      COD5_GSC_PROPERTY: ${COD5_GSC_PROPERTY:-}
      COD5_GSC_PROFILE_DIR: /gsc/profile
      COD5_DATABASE_FILE: /data/editorial.sqlite
      COD5_GSC_CALLBACK_URL: ${COD5_GSC_CALLBACK_URL:-}
      COD5_GSC_CALLBACK_TOKEN: ${COD5_GSC_CALLBACK_TOKEN:-}
      COD5_GSC_MAX_ATTEMPTS: ${COD5_GSC_MAX_ATTEMPTS:-3}
    ports:
      - "127.0.0.1:5909:5900"
    volumes:
      - /opt/cod5/codigo5-web/data:/data
      - /opt/cod5/codigo5-web/gsc:/gsc
      - /opt/cod5/codigo5-web/gsc/releases/gsc-google-error-0380b81af787/gsc-browser.mjs:/app/server/gsc-browser.mjs:ro
      - /opt/cod5/codigo5-web/gsc/releases/bfcae47/gsc-worker.mjs:/app/server/gsc-worker.mjs:ro
      - /opt/cod5/codigo5-web/gsc/releases/bfcae47/gsc-whatsapp.mjs:/app/server/gsc-whatsapp.mjs:ro
    shm_size: 256m
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs'); if(Date.now()-f.statSync('/gsc/heartbeat').mtimeMs>120000) process.exit(1)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
  backup:
    image: ${COD5_IMAGE:?Release image required}
    container_name: codigo5-web-backup
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do node /app/backup.mjs || exit 1; sleep 21600; done"]
    volumes:
      - /opt/cod5/codigo5-web/data:/data
      - /opt/cod5/codigo5-web/backups:/backups
    healthcheck:
      disable: true
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m

networks:
  evolution:
    external: true
    name: cod5-evolution-net
